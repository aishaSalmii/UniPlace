<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Change password')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main>
    <div th:replace="~{fragments/layout :: flash}"></div>
    <h1>Change password</h1>
    <form class="card" method="post" th:action="@{/account/password}">
        <label for="current">Current password</label><input type="password" id="current" name="current" autocomplete="current-password">
        <label for="next">New password (at least 10 characters, including a digit)</label><input type="password" id="next" name="next" autocomplete="new-password">
        <label for="confirm">Repeat the new password</label><input type="password" id="confirm" name="confirm" autocomplete="new-password">
        <div class="actions"><button type="submit">Change password</button></div>
    </form>
</main>
</body>
</html>
