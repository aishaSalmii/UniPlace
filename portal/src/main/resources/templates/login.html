<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Log in')}"></head>
<body>
<main class="login">
    <div class="card">
        <h1>UniPlace</h1>
        <p class="muted">Internship and placement portal</p>
        <div class="flash bad" th:if="${error}" th:text="${error}">error</div>
        <div class="flash ok" th:if="${param.logout}">You are logged out.</div>
        <form th:action="@{/login}" method="post">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" autofocus autocomplete="username">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password">
            <div class="actions"><button type="submit">Log in</button></div>
        </form>
    </div>
</main>
</body>
</html>
