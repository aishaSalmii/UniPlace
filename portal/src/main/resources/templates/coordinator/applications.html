<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('All applications')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main>
    <h1>All applications</h1>
    <form class="card" method="get" th:action="@{/coordinator/applications}">
        <div class="row">
            <div><label for="state">State</label><select id="state" name="state"><option value="">Any state</option>
                <option th:each="s : ${states}" th:value="${s}" th:text="${@fmt.label(s)}" th:selected="${s == state}">s</option></select></div>
            <div><label for="companyId">Company</label><select id="companyId" name="companyId"><option value="">Any company</option>
                <option th:each="c : ${companies}" th:value="${c.id}" th:text="${c.name}" th:selected="${c.id == companyId}">c</option></select></div>
            <div><label for="postingId">Posting id</label><input type="number" id="postingId" name="postingId" th:value="${postingId}"></div>
        </div>
        <div class="actions"><button type="submit">Filter</button></div>
    </form>
    <table>
        <tr><th>Id</th><th>Student</th><th>Posting</th><th>Company</th><th>Score</th><th>Submitted</th><th>State</th></tr>
        <tr th:each="a : ${page.content}">
            <td><a th:href="@{/applications/{id}(id=${a.id})}" th:text="${a.id}">1</a></td>
            <td th:text="${a.student.fullName}">s</td>
            <td th:text="${a.posting.title}">p</td>
            <td th:text="${a.posting.company.name}">c</td>
            <td th:text="${a.matchScore}">0</td>
            <td th:text="${@fmt.dateTime(a.submittedAt)}">d</td>
            <td><span class="badge" th:classappend="${#strings.toLowerCase(a.state)}" th:text="${@fmt.label(a.state)}">s</span></td>
        </tr>
    </table>
    <div class="pager" th:if="${page.totalPages > 1}">
        <a th:if="${page.hasPrevious()}" th:href="@{/coordinator/applications(page=${page.number - 1})}">Previous</a>
        <span class="muted" th:text="|Page ${page.number + 1} of ${page.totalPages} · ${page.totalElements} applications|">p</span>
        <a th:if="${page.hasNext()}" th:href="@{/coordinator/applications(page=${page.number + 1})}">Next</a>
    </div>
</main>
</body>
</html>
