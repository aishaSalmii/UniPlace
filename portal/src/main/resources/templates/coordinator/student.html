<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${student.fullName})}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main>
    <div th:replace="~{fragments/layout :: flash}"></div>
    <h1 th:text="${student.fullName}">name</h1>
    <div class="card">
        <p th:text="|${student.studentNumber} · ${student.email} · skills: ${#strings.listJoin(student.skills, ', ')}|">info</p>
        <p>Academic standing: <strong th:text="${@fmt.label(student.standing)}">s</strong> (derived from the GPA)</p>
    </div>
    <form class="card" method="post" th:action="@{/coordinator/students/{id}(id=${student.id})}">
        <h2>Academic record</h2>
        <div class="row">
            <div><label for="program">Program</label><input type="text" id="program" name="program" th:value="${student.program}"></div>
            <div><label for="gpa">GPA</label><input type="number" step="0.01" min="0" max="4" id="gpa" name="gpa" th:value="${student.gpa}"></div>
            <div><label for="creditsCompleted">Credits completed</label><input type="number" min="0" max="140" id="creditsCompleted" name="creditsCompleted" th:value="${student.creditsCompleted}"></div>
            <div><label for="priorInternships">Prior internships</label><input type="number" min="0" id="priorInternships" name="priorInternships" th:value="${student.priorInternships}"></div>
        </div>
        <div class="actions"><button type="submit">Save</button><a th:href="@{/coordinator/students}">Back</a></div>
    </form>
</main>
</body>
</html>
