<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Company')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main>
    <div th:replace="~{fragments/layout :: flash}"></div>
    <h1 th:text="${company == null} ? 'Register your company' : ${company.name}">Company</h1>
    <p th:if="${company != null}">Status: <span class="badge" th:classappend="${#strings.toLowerCase(company.status)}" th:text="${@fmt.label(company.status)}">s</span></p>
    <form class="card" method="post" th:action="@{/recruiter/company}">
        <label for="name">Company name</label><input type="text" id="name" name="name" maxlength="120" th:value="${company?.name}">
        <label for="sector">Sector</label><input type="text" id="sector" name="sector" maxlength="80" th:value="${company?.sector}">
        <label for="contactEmail">Contact e-mail</label><input type="email" id="contactEmail" name="contactEmail" th:value="${company?.contactEmail}">
        <div class="actions"><button type="submit" th:text="${company == null} ? 'Register' : 'Save'">Save</button></div>
    </form>
</main>
</body>
</html>
