spring.application.name=uniplace-portal
server.port=8080
server.address=127.0.0.1
server.servlet.session.timeout=30m

spring.datasource.url=jdbc:h2:file:./data/uniplace;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Qatar
spring.h2.console.enabled=false

spring.thymeleaf.cache=false

spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=7MB

server.error.whitelabel.enabled=false
server.error.include-stacktrace=always
server.error.include-message=always
server.error.include-exception=true

uniplace.zone=Asia/Qatar
uniplace.seed.enabled=true
uniplace.upload-dir=./data/uploads
uniplace.engine.default-url=http://127.0.0.1:8081/api/v1

logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN
