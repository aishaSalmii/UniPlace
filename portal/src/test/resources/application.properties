spring.datasource.url=jdbc:h2:mem:uniplace-${random.uuid};DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=true
spring.thymeleaf.cache=false
uniplace.zone=Asia/Qatar
uniplace.seed.enabled=false
uniplace.scheduler.enabled=false
uniplace.upload-dir=./target/test-uploads
uniplace.engine.default-url=http://localhost:8081/api/v1
logging.level.root=WARN
